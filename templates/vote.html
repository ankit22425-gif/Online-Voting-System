<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Cast Your Vote
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f8fafc
                );

            color: #172033;

        }

        .container {

            width: 94%;

            max-width: 1000px;

            margin: 30px auto;

        }

        .election-header {

            text-align: center;

            background: white;

            border-radius: 18px;

            padding: 28px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,.08);

            margin-bottom: 25px;

            border-top:
                6px solid #2563eb;

        }

        .flag {

            font-size: 55px;

        }

        .election-header h1 {

            margin: 8px 0;

            font-size: 38px;

            font-weight: 900;

        }

        .election-header h2 {

            margin: 5px 0;

            font-size: 22px;

            color: #2563eb;

        }

        .voter-box {

            background: #ecfdf5;

            border:
                1px solid #86efac;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            margin-top: 15px;

        }

        .candidate-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );

            gap: 18px;

        }

        .candidate-card {

            background: white;

            border-radius: 16px;

            padding: 22px;

            border:
                2px solid #e2e8f0;

            cursor: pointer;

            transition: .2s;

        }

        .candidate-card:hover {

            transform:
                translateY(-3px);

            border-color:
                #2563eb;

        }

        .candidate-card.selected {

            border-color:
                #16a34a;

            background:
                #f0fdf4;

        }

        .candidate-symbol {

            font-size: 65px;

            text-align: center;

            margin-bottom: 10px;

        }

        .candidate-card h3 {

            text-align: center;

            margin: 5px 0;

            font-size: 23px;

        }

        .party {

            text-align: center;

            color: #64748b;

            font-size: 17px;

        }

        .vote-radio {

            display: none;

        }

        .selected-text {

            display: none;

            text-align: center;

            color: #16a34a;

            font-weight: bold;

            margin-top: 10px;

        }

        .candidate-card.selected
        .selected-text {

            display: block;

        }

        .photo-section {

            background: white;

            border-radius: 16px;

            padding: 25px;

            margin-top: 25px;

            text-align: center;

        }

        video {

            width: 100%;

            max-width: 500px;

            border-radius: 14px;

            background: black;

        }

        canvas {

            display: none;

        }

        .capture-btn {

            margin-top: 15px;

            border: 0;

            background: #2563eb;

            color: white;

            padding: 13px 25px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

        }

        .submit-btn {

            width: 100%;

            margin-top: 25px;

            padding: 18px;

            border: 0;

            border-radius: 12px;

            background: #16a34a;

            color: white;

            font-size: 20px;

            font-weight: 900;

            cursor: pointer;

        }

        .submit-btn:disabled {

            background: #94a3b8;

            cursor: not-allowed;

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2563eb;

            text-decoration: none;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================================
         ELECTION HEADER
    ========================================== -->

    <div class="election-header">

        <div class="flag">
            🇮🇳
        </div>

        <h1>
            {{ election.election_name }}
        </h1>

        <h2>
            ONLINE VOTING
        </h2>

        <div class="voter-box">

            Voter ID:

            <strong>
                {{ voter }}
            </strong>

        </div>

    </div>


    <!-- =========================================
         VOTE FORM
    ========================================== -->

    <form
        method="POST"
        action="{{ url_for('cast_vote') }}"
        id="voteForm"
    >


        <h2>
            Select Your Candidate
        </h2>


        <div class="candidate-grid">


            {% for candidate in candidates %}

                <label
                    class="candidate-card"
                    data-id="{{ candidate.id }}"
                >

                    <input
                        type="radio"
                        class="vote-radio"
                        name="candidate_id"
                        value="{{ candidate.id }}"
                        required
                    >


                    <div class="candidate-symbol">

                        {{ candidate.symbol }}

                    </div>


                    <h3>

                        {{ candidate.name }}

                    </h3>


                    <div class="party">

                        {{ candidate.party }}

                    </div>


                    <div class="selected-text">

                        ✓ SELECTED

                    </div>

                </label>

            {% endfor %}


        </div>


        <!-- =========================================
             PHOTO
        ========================================== -->

        <div class="photo-section">

            <h2>
                📷 Live Photo
            </h2>

            <p>
                Capture your photo before submitting your vote.
            </p>

            <video
                id="video"
                autoplay
                playsinline
            ></video>

            <br>

            <button
                type="button"
                class="capture-btn"
                onclick="capturePhoto()"
            >
                📸 Capture Photo
            </button>

            <canvas
                id="canvas"
            ></canvas>

            <input
                type="hidden"
                name="live_image"
                id="live_image"
            >

            <p id="photoStatus"></p>

        </div>


        <button
            type="submit"
            class="submit-btn"
            id="submitBtn"
            disabled
        >
            🗳️ CAST YOUR VOTE
        </button>


    </form>


    <a
        href="{{ url_for('logout') }}"
        class="back"
    >
        Exit Voting
    </a>


</div>


<script>

const cards =
    document.querySelectorAll(
        ".candidate-card"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );

const video =
    document.getElementById(
        "video"
    );

const canvas =
    document.getElementById(
        "canvas"
    );

const liveImage =
    document.getElementById(
        "live_image"
    );

const photoStatus =
    document.getElementById(
        "photoStatus"
    );


let photoCaptured = false;


cards.forEach(
    function(card) {

        card.addEventListener(
            "click",
            function() {

                cards.forEach(
                    function(c) {

                        c.classList.remove(
                            "selected"
                        );

                    }
                );

                card.classList.add(
                    "selected"
                );

                const radio =
                    card.querySelector(
                        "input"
                    );

                radio.checked = true;

                updateSubmit();

            }
        );

    }
);


// =====================================================
// CAMERA
// =====================================================

navigator.mediaDevices
    .getUserMedia({
        video: true
    })
    .then(
        function(stream) {

            video.srcObject = stream;

        }
    )
    .catch(
        function(error) {

            console.log(
                "Camera error:",
                error
            );

            photoStatus.innerText =
                "Camera permission required.";

        }
    );


// =====================================================
// CAPTURE
// =====================================================

function capturePhoto() {

    if (!video.videoWidth) {

        photoStatus.innerText =
            "Camera is not ready.";

        return;

    }

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

    const context =
        canvas.getContext(
            "2d"
        );

    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );

    const image =
        canvas.toDataURL(
            "image/jpeg",
            0.85
        );

    liveImage.value =
        image;

    photoCaptured = true;

    photoStatus.innerText =
        "✓ Photo captured successfully.";

    photoStatus.style.color =
        "green";

    updateSubmit();

}


// =====================================================
// SUBMIT ENABLE
// =====================================================

function updateSubmit() {

    const selected =
        document.querySelector(
            'input[name="candidate_id"]:checked'
        );

    submitBtn.disabled =
        !selected ||
        !photoCaptured;

}


// =====================================================
// FORM SUBMIT
// =====================================================

document
    .getElementById("voteForm")
    .addEventListener(
        "submit",
        function(event) {

            const selected =
                document.querySelector(
                    'input[name="candidate_id"]:checked'
                );

            if (!selected) {

                event.preventDefault();

                alert(
                    "Please select a candidate."
                );

                return;

            }

            if (!photoCaptured) {

                event.preventDefault();

                alert(
                    "Please capture your live photo."
                );

                return;

            }

            submitBtn.disabled =
                true;

            submitBtn.innerText =
                "Submitting Vote...";

        }
    );

</script>


</body>

</html>
