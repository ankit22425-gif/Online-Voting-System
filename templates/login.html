<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Voter Login
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #f8fafc
                );

        }

        .box {

            width: 92%;

            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.1);

            text-align: center;

        }

        .flag {

            font-size: 60px;

        }

        h1 {

            font-size: 32px;

            font-weight: 900;

            margin: 8px 0;

        }

        h2 {

            color: #2563eb;

            font-size: 20px;

        }

        input {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            border:
                1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 17px;

        }

        button {

            width: 100%;

            margin-top: 15px;

            padding: 15px;

            border: 0;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }

        .error {

            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 10px;

        }

    </style>

</head>


<body>


<div class="box">

    <div class="flag">
        🇮🇳
    </div>

    {% if election %}

        <h1>
            {{ election.election_name }}
        </h1>

        <h2>
            ONLINE VOTING
        </h2>

    {% else %}

        <h1>
            ONLINE VOTING
        </h1>

    {% endif %}


    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% for category, message in messages %}

            <div class="error">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form
        method="POST"
    >

        <input
            type="text"
            name="voter_id"
            placeholder="Enter Voter ID"
            autocomplete="off"
            required
        >

        <button type="submit">

            Continue to Voting

        </button>

    </form>


</div>


</body>

</html>
