<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voter Authentication Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='hhh.css') }}">
</head>
<body>
    <div class="gov-top-bar">
        <div class="container top-bar-content">
            <span>🇮🇳 Official Voter Authentication Gateway</span>
        </div>
    </div>

    <div class="container" style="max-width: 450px; margin-top: 60px;">
        <div class="portal-card">
            <div class="card-header">
                <h3>Voter Identity Login</h3>
            </div>
            <div class="card-body">
                <form action="/login" method="POST">
                    <div style="margin-bottom: 15px;">
                        <label style="display:block; margin-bottom:5px; font-weight:600;">Voter ID Number (EPIC):</label>
                        <input type="text" name="voter_id" placeholder="e.g. ABC1234567" required style="width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:4px;">
                    </div>
                    <button type="submit" class="btn-primary" style="width:100%;">Authenticate & Proceed</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
